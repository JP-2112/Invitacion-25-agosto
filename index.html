<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#09070b"
  >

  <title>Para ti | 25 de agosto</title>


  <!-- FUENTES -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =========================================
       VARIABLES
    ========================================= */

    :root {

      --bg: #09070b;

      --plum: #241026;

      --purple: #8d4ca8;

      --purple2: #c58bd4;

      --gold: #e8b98f;

      --cream: #f7eadf;

      --muted: #cbb8c5;

    }


    /* =========================================
       RESET
    ========================================= */

    * {

      box-sizing: border-box;

    }


    html,
    body {

      margin: 0;

      min-height: 100%;

      background:
        var(--bg);

      color:
        var(--cream);

    }


    body {

      font-family:
        "Cormorant Garamond",
        Georgia,
        serif;

      overflow-x: hidden;

    }


    button,
    input {

      font: inherit;

    }


    /* =========================================
       PANTALLAS
    ========================================= */

    .screen {

      min-height: 100vh;

      min-height: 100svh;

      display: flex;

      justify-content: center;

      align-items: center;

      position: relative;

      overflow: hidden;

      isolation: isolate;

    }


    .screen::before {

      content: "";

      position: absolute;

      inset: -20%;

      background:

        radial-gradient(
          circle at 20% 20%,
          rgba(141, 76, 168, 0.22),
          transparent 30%
        ),

        radial-gradient(
          circle at 80% 75%,
          rgba(197, 139, 212, 0.14),
          transparent 28%
        ),

        radial-gradient(
          circle at 50% 50%,
          rgba(232, 185, 143, 0.06),
          transparent 35%
        );

      filter:
        blur(18px);

      z-index:
        -2;

    }


    .stars,
    .petals {

      position:
        absolute;

      inset:
        0;

      pointer-events:
        none;

      z-index:
        -1;

    }


    /* =========================================
       ESTRELLAS
    ========================================= */

    .star {

      position:
        absolute;

      width:
        3px;

      height:
        3px;

      border-radius:
        50%;

      background:
        #f6d9c4;

      opacity:
        0.35;

      box-shadow:
        0 0 12px #e8b98f;

      animation:
        twinkle 3.5s infinite ease-in-out;

    }


    @keyframes twinkle {

      50% {

        opacity:
          0.9;

        transform:
          scale(1.7);

      }

    }


    /* =========================================
       CONTENEDOR PRINCIPAL
    ========================================= */

    .intro-container {

      width:
        min(94%, 620px);

      display:
        flex;

      flex-direction:
        column;

      align-items:
        center;

      padding:
        25px 0 40px;

      animation:
        appear 0.9s ease both;

    }


    /* =========================================
       CARRUSEL
    ========================================= */

    .carousel {

      width:
        100%;

      position:
        relative;

      margin-bottom:
        20px;

      overflow:
        hidden;

      border-radius:
        18px;

      border:
        1px solid
        rgba(232, 185, 143, 0.30);

      background:
        rgba(20, 10, 22, 0.65);

      box-shadow:

        0 20px 60px
        rgba(0, 0, 0, 0.55),

        0 0 35px
        rgba(141, 76, 168, 0.12);

      backdrop-filter:
        blur(8px);

      padding:
        8px;

    }


    /* Máscaras laterales */

    .carousel::before,
    .carousel::after {

      content:
        "";

      position:
        absolute;

      top:
        0;

      bottom:
        0;

      width:
        70px;

      z-index:
        5;

      pointer-events:
        none;

    }


    .carousel::before {

      left:
        0;

      background:
        linear-gradient(
          to right,
          rgba(9, 7, 11, 0.85),
          transparent
        );

    }


    .carousel::after {

      right:
        0;

      background:
        linear-gradient(
          to left,
          rgba(9, 7, 11, 0.85),
          transparent
        );

    }


    /* =========================================
       PISTA DEL CARRUSEL
    ========================================= */

    .carousel-track {

      display:
        flex;

      width:
        max-content;

      gap:
        12px;

      will-change:
        transform;

      transform:
        translate3d(0, 0, 0);

      animation:
        carouselMove 32s
        linear infinite;

    }


    /*
      La animación se detiene suavemente
      al poner el mouse encima.
    */

    .carousel:hover
    .carousel-track {

      animation-play-state:
        paused;

    }


    /* =========================================
       FOTOS
    ========================================= */

    .carousel-photo {

      width:
        180px;

      height:
        235px;

      flex:
        0 0 180px;

      object-fit:
        cover;

      display:
        block;

      border-radius:
        13px;

      border:
        1px solid
        rgba(232, 185, 143, 0.18);

      box-shadow:
        0 8px 25px
        rgba(0, 0, 0, 0.45);

      transition:
        transform 0.4s ease,
        filter 0.4s ease;

    }


    .carousel-photo:hover {

      transform:
        scale(1.025);

      filter:
        brightness(1.08);

    }


    /* =========================================
       ANIMACIÓN DEL CARRUSEL
    ========================================= */

    @keyframes carouselMove {

      from {

        transform:
          translate3d(
            0,
            0,
            0
          );

      }

      to {

        transform:
          translate3d(
            var(--carousel-distance),
            0,
            0
          );

      }

    }


    /* =========================================
       TARJETA INTRO
    ========================================= */

    .intro {

      width:
        100%;

      text-align:
        center;

      padding:
        42px 28px;

      border:
        1px solid
        rgba(232, 185, 143, 0.38);

      background:
        linear-gradient(
          145deg,
          rgba(30, 16, 31, 0.84),
          rgba(8, 7, 10, 0.90)
        );

      box-shadow:

        0 25px 80px
        rgba(0, 0, 0, 0.55),

        inset 0 0 70px
        rgba(141, 76, 168, 0.06);

      border-radius:
        5px;

      backdrop-filter:
        blur(10px);

    }


    /* =========================================
       TEXTO SUPERIOR
    ========================================= */

    .eyebrow {

      letter-spacing:
        0.28em;

      text-transform:
        uppercase;

      font-size:
        0.78rem;

      color:
        var(--gold);

    }


    /* =========================================
       TÍTULO
    ========================================= */

    h1 {

      font-family:
        "Great Vibes",
        cursive;

      font-size:
        clamp(
          4rem,
          15vw,
          7rem
        );

      line-height:
        0.9;

      font-weight:
        400;

      margin:
        20px 0 12px;

      color:
        #f0c5a6;

      text-shadow:
        0 0 30px
        rgba(232, 185, 143, 0.13);

    }


    /* =========================================
       DESCRIPCIÓN
    ========================================= */

    .intro p {

      color:
        var(--muted);

      font-size:
        1.18rem;

      line-height:
        1.45;

      margin:
        0 auto 28px;

      max-width:
        390px;

    }


    /* =========================================
       INPUT
    ========================================= */

    .date-input {

      width:
        100%;

      max-width:
        340px;

      padding:
        14px 18px;

      border-radius:
        999px;

      border:
        1px solid
        rgba(232, 185, 143, 0.42);

      background:
        rgba(255, 255, 255, 0.045);

      color:
        var(--cream);

      text-align:
        center;

      outline:
        none;

      transition:
        0.25s;

      font-size:
        1.05rem;

    }


    .date-input::placeholder {

      color:
        #9e8997;

    }


    .date-input:focus {

      border-color:
        var(--gold);

      box-shadow:
        0 0 0 4px
        rgba(232, 185, 143, 0.08);

    }


    /* =========================================
       BOTÓN
    ========================================= */

    .open-btn {

      margin-top:
        14px;

      padding:
        13px 28px;

      border:
        0;

      border-radius:
        999px;

      color:
        #1a0d18;

      background:
        linear-gradient(
          135deg,
          #f1c8a8,
          #d99bcf
        );

      cursor:
        pointer;

      font-weight:
        700;

      letter-spacing:
        0.05em;

      box-shadow:
        0 10px 30px
        rgba(141, 76, 168, 0.22);

      transition:
        transform 0.2s,
        box-shadow 0.2s;

    }


    .open-btn:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 14px 35px
        rgba(141, 76, 168, 0.30);

    }


    .open-btn:active {

      transform:
        translateY(0);

    }


    /* =========================================
       ERROR
    ========================================= */

    .error {

      min-height:
        24px;

      margin:
        8px 0 0;

      color:
        #e8a4b4;

      font-size:
        0.95rem;

    }


    .hidden {

      display:
        none !important;

    }


    /* =========================================
       INVITACIÓN
    ========================================= */

    .invitation-wrap {

      width:
        min(94vw, 720px);

      padding:
        24px 0 70px;

      position:
        relative;

      animation:
        reveal 1.2s ease both;

    }


    .invitation-card {

      position:
        relative;

      background:
        #100b10;

      border-radius:
        3px;

      overflow:
        hidden;

      box-shadow:

        0 30px 100px
        rgba(0, 0, 0, 0.7),

        0 0 0 1px
        rgba(232, 185, 143, 0.18);

    }


    .invitation-card img {

      display:
        block;

      width:
        100%;

      height:
        auto;

    }


    /* =========================================
       ERROR DE IMAGEN
    ========================================= */

    #imageError {

      padding:
        40px 20px;

      text-align:
        center;

      color:
        #d9c4d0;

    }


    /* =========================================
       MENSAJE FINAL
    ========================================= */

    .final-note {

      text-align:
        center;

      margin:
        22px auto 0;

      padding:
        18px 22px;

      color:
        #d9c4d0;

      font-size:
        1.08rem;

      line-height:
        1.45;

      opacity:
        0.95;

    }


    /* =========================================
       BOTÓN DE MÚSICA
    ========================================= */

    .music {

      position:
        fixed;

      right:
        18px;

      bottom:
        18px;

      z-index:
        20;

      width:
        46px;

      height:
        46px;

      border-radius:
        50%;

      border:
        1px solid
        rgba(232, 185, 143, 0.45);

      background:
        rgba(20, 10, 22, 0.75);

      color:
        #f0c5a6;

      cursor:
        pointer;

      backdrop-filter:
        blur(8px);

      display:
        grid;

      place-items:
        center;

      transition:
        transform 0.2s,
        background 0.2s;

    }


    .music:hover {

      transform:
        scale(1.08);

      background:
        rgba(40, 18, 42, 0.90);

    }


    .music small {

      font-size:
        15px;

    }


    /* =========================================
       ANIMACIONES
    ========================================= */

    @keyframes appear {

      from {

        opacity:
          0;

        transform:
          translateY(18px);

      }

      to {

        opacity:
          1;

        transform:
          none;

      }

    }


    @keyframes reveal {

      from {

        opacity:
          0;

        transform:
          translateY(28px)
          scale(0.985);

      }

      to {

        opacity:
          1;

        transform:
          none;

      }

    }


    /* =========================================
       PÉTALOS
    ========================================= */

    .petal {

      position:
        absolute;

      top:
        -30px;

      width:
        11px;

      height:
        17px;

      border-radius:
        100% 0 100% 0;

      background:
        linear-gradient(
          145deg,
          #9c5ab2,
          #d09bdb
        );

      opacity:
        0.5;

      animation:
        fall linear infinite;

    }


    @keyframes fall {

      to {

        transform:
          translate3d(
            var(--drift),
            110vh,
            0
          )
          rotate(560deg);

        opacity:
          0;

      }

    }


    /* =========================================
       CELULAR
    ========================================= */

    @media (max-width: 600px) {

      .intro-container {

        width:
          94%;

        padding-top:
          18px;

      }


      .carousel {

        margin-bottom:
          15px;

        border-radius:
          15px;

        padding:
          6px;

      }


      .carousel-track {

        gap:
          9px;

        animation-duration:
          30s;

      }


      .carousel-photo {

        width:
          125px;

        height:
          165px;

        flex-basis:
          125px;

        border-radius:
          10px;

      }


      .carousel::before,
      .carousel::after {

        width:
          35px;

      }


      .intro {

        padding:
          36px 20px;

      }


      .intro p {

        font-size:
          1.08rem;

      }


      .date-input {

        font-size:
          1rem;

      }


      .open-btn {

        padding:
          13px 24px;

      }


      .invitation-wrap {

        width:
          96vw;

        padding-top:
          12px;

      }


      .final-note {

        font-size:
          1rem;

      }

    }


    /* =========================================
       CELULARES PEQUEÑOS
    ========================================= */

    @media (max-width: 380px) {

      .carousel-photo {

        width:
          110px;

        height:
          150px;

        flex-basis:
          110px;

      }


      .intro {

        padding:
          32px 17px;

      }


      .eyebrow {

        font-size:
          0.70rem;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================
       PANTALLA INICIAL

    <div

    <div

    <div class="intro-container">


      <!-- =====================================

      <div

        <div

        >

          <!-- PRIMERA SERIE -->

          <img

          <img

          >

          <img

          <img
            src="assets/foto4.jpg"

          >

          <img

          <!-- SEGUNDA SERIE -->

          <img

      <!-- =====================================

  <audio

      src="assets/musica.mp3"
      type="audio/mpeg"
    >

  </audio>


  <script>


    /* =========================================
       ELEMENTOS
    ========================================= */

    const intro =
      document.getElementById(
        "introScreen"
      );


    const invitation =
      document.getElementById(
        "invitationScreen"
      );


    const input =
      document.getElementById(
        "dateInput"
      );


    const btn =
      document.getElementById(
        "openBtn"
      );


    const error =
      document.getElementById(
        "error"
      );


    const musicBtn =
      document.getElementById(
        "musicBtn"
      );


    const music =
      document.getElementById(
        "backgroundMusic"
      );


    const carousel =
      document.getElementById(
        "carousel"
      );


    const carouselTrack =
      document.getElementById(
        "carouselTrack"
      );


    /* =========================================
       CONFIGURACIÓN DEL CARRUSEL
    ========================================= */

    function setupCarousel() {


      /*
        Tomamos todas las fotos.

        La primera mitad es la serie original.
        La segunda mitad es la copia.
      */

      const photos =
        carouselTrack.querySelectorAll(
          ".carousel-photo"
        );


      if (
        photos.length < 2
      ) {

        return;

      }


      /*
        Calculamos la cantidad
        de fotos de la primera serie.
      */

      const half =
        Math.floor(
          photos.length / 2
        );


      /*
        Sumamos los anchos reales
        de la primera serie.
      */

      let distance = 0;


      for (
        let i = 0;
        i < half;
        i++
      ) {

        distance +=
          photos[i].getBoundingClientRect().width;


        /*
          Añadimos el espacio
          entre las fotos.
        */

        if (
          i < half - 1
        ) {

          const style =
            window.getComputedStyle(
              carouselTrack
            );


          const gap =
            parseFloat(
              style.columnGap ||
              style.gap ||
              0
            );


          distance +=
            gap;

        }

      }


      /*
        CSS recibe la distancia
        calculada automáticamente.
      */

      carouselTrack.style.setProperty(
        "--carousel-distance",
        `-${distance}px`
      );

    }


    /*
      Esperamos a que las imágenes
      estén completamente cargadas.
    */

    window.addEventListener(
      "load",
      setupCarousel
    );


    /*
      También recalculamos si
      cambia el tamaño de pantalla.
    */

    window.addEventListener(
      "resize",
      setupCarousel
    );


    /* =========================================
       NORMALIZAR FECHA
    ========================================= */

    function normalize(value) {

      return value

        .toLowerCase()

        .normalize("NFD")

        .replace(
          /[\u0300-\u036f]/g,
          ""
        )

        .replace(
          /\s+/g,
          " "
        )

        .trim();

    }


    /* =========================================
       VALIDAR FECHA
    ========================================= */

    function validDate(value) {

      const date =
        normalize(value);


      return [

        "25/08",

        "25-08",

        "2508",

        "25 agosto",

        "25 de agosto"

      ].includes(
        date
      );

    }


    /* =========================================
       ESTRELLAS
    ========================================= */

    function makeStars(
      container,
      count = 28
    ) {


      for (
        let i = 0;
        i < count;
        i++
      ) {


        const star =
          document.createElement(
            "i"
          );


        star.className =
          "star";


        star.style.left =
          Math.random() *
          100 +
          "%";


        star.style.top =
          Math.random() *
          100 +
          "%";


        star.style.animationDelay =
          Math.random() *
          3.5 +
          "s";


        container.appendChild(
          star
        );


      }

    }


    /* =========================================
       PÉTALOS
    ========================================= */

    function makePetals(
      container,
      count = 16
    ) {


      for (
        let i = 0;
        i < count;
        i++
      ) {


        const petal =
          document.createElement(
            "i"
          );


        petal.className =
          "petal";


        petal.style.left =
          Math.random() *
          100 +
          "%";


        petal.style.animationDuration =
          7 +
          Math.random() *
          8 +
          "s";


        petal.style.animationDelay =
          -Math.random() *
          12 +
          "s";


        petal.style.setProperty(

          "--drift",

          -120 +
          Math.random() *
          240 +
          "px"

        );


        petal.style.transform =
          "rotate(" +
          Math.random() *
          360 +
          "deg)";


        container.appendChild(
          petal
        );


      }

    }


    /* =========================================
       CREAR EFECTOS
    ========================================= */

    makeStars(
      document.getElementById(
        "stars"
      )
    );


    makeStars(
      document.getElementById(
        "stars2"
      )
    );


    makePetals(
      document.getElementById(
        "petals"
      )
    );


    makePetals(
      document.getElementById(
        "petals2"
      )
    );


    /* =========================================
       ABRIR INVITACIÓN
    ========================================= */

    async function openInvitation() {


      /* ---------------------------------------
         COMPROBAR FECHA
      --------------------------------------- */

      if (
        !validDate(
          input.value
        )
      ) {


        error.textContent =
          "Pista: es el 25/08.";


        input.focus();


        return;

      }


      error.textContent =
        "";


      /* ---------------------------------------
         MOSTRAR INVITACIÓN
      --------------------------------------- */

      intro.classList.add(
        "hidden"
      );


      invitation.classList.remove(
        "hidden"
      );


      musicBtn.classList.remove(
        "hidden"
      );


      /* ---------------------------------------
         MÚSICA
      --------------------------------------- */

      music.pause();

      music.currentTime = 0;


      try {


        await music.play();


        musicBtn.innerHTML =
          "<small>❚❚</small>";


      }


      catch (e) {


        console.log(
          "El navegador bloqueó el audio:",
          e
        );


        musicBtn.innerHTML =
          "<small>♫</small>";

      }


      /* ---------------------------------------
         IR ARRIBA
      --------------------------------------- */

      window.scrollTo({

        top:
          0,

        behavior:
          "smooth"

      });

    }


    /* =========================================
       BOTÓN ABRIR
    ========================================= */

    btn.addEventListener(
      "click",
      openInvitation
    );


    /* =========================================
       ENTER
    ========================================= */

    input.addEventListener(
      "keydown",
      function(event) {


        if (
          event.key ===
          "Enter"
        ) {


          event.preventDefault();


          openInvitation();


        }

      }
    );


    /* =========================================
       FORMATEAR FECHA

       2508

       SE CONVIERTE EN

       25/08
    ========================================= */

    input.addEventListener(
      "input",
      function() {


        let value =
          input.value.replace(
            /\D/g,
            ""
          );


        if (
          value.length >
          4
        ) {

          value =
            value.substring(
              0,
              4
            );

        }


        if (
          value.length >=
          3
        ) {


          value =
            value.substring(
              0,
              2
            ) +
            "/" +
            value.substring(
              2
            );

        }


        input.value =
          value;


        error.textContent =
          "";

      }
    );


    /* =========================================
       BOTÓN DE MÚSICA
    ========================================= */

    musicBtn.addEventListener(
      "click",
      async function() {


        if (
          music.paused
        ) {


          try {


            await music.play();


            musicBtn.innerHTML =
              "<small>❚❚</small>";


          }


          catch (e) {


            console.log(
              "No se pudo reproducir:",
              e
            );

          }


        }

        else {


          music.pause();


          musicBtn.innerHTML =
            "<small>♫</small>";

        }

      }
    );


    /* =========================================
       ESTADO INICIAL
    ========================================= */

    music.pause();

    music.currentTime = 0;


  </script>
